name: Manual Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew test assembleDebug
      - id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print("name=" + json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text())["elements"][0]["versionName"])
          PY
      - run: cp app/build/outputs/apk/debug/app-debug.apk "ssMusic-Player-v${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: ssMusic-Player-v${{ steps.version.outputs.name }}
          path: ssMusic-Player-v${{ steps.version.outputs.name }}.apk
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: gh release create "v${VERSION}" "ssMusic-Player-v${VERSION}.apk" --target "${GITHUB_SHA}" --title "ssMusic Player ${VERSION}" --generate-notes --latest
